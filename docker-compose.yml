networks:
  bigdata-net:
    driver: bridge

services:
  # ==========================================
  # 1. APACHE KAFKA (KRaft Mode - Tanpa Zookeeper)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'Mk3OEYBSD3DxOwHVY9uPhg'
    networks:
      - bigdata-net

  # ==========================================
  # 2. APACHE SPARK (Official Apache Image)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master -h spark-master -p 7077 --webui-port 8080
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - bigdata-net

  # ==========================================
  # 3. APACHE AIRFLOW (Orchestrator)
  # ==========================================
  airflow:
      build: ./airflow
      container_name: airflow-server
      restart: always
      depends_on:
        - kafka
        - spark-master
      environment:
        - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
        - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
        - AIRFLOW__CORE__LOAD_EXAMPLES=False
      ports:
        - "8081:8080"
      volumes:
        - ./airflow/dags:/opt/airflow/dags
      command: >
        bash -c "airflow db migrate &&
                 airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true &&
                 airflow scheduler &
                 exec airflow webserver"
      networks:
        - bigdata-net